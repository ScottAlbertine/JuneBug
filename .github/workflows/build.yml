name: Build MCP Server Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.builder }}

    strategy:
      matrix:
        include:
          - os: Windows
            builder: windows-latest
            target_name: JuneBug-windows
            asset_path: dist/JuneBug-windows.exe
          - os: MacOS
            builder: macos-latest
            target_name: JuneBug-macos
            # eventually, asset_name will be JuneBug-macos.app once I get system tray support
            asset_path: dist/JuneBug-macos
          - os: Linux
            builder: ubuntu-latest
            target_name: JuneBug-linux
            asset_path: dist/JuneBug-linux

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build with PyInstaller
        run: pyinstaller --onefile --name ${{ matrix.target_name }} --add-data icon.png:. main.py

      - name: Upload Release Asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target_name }}
          path: ${{ matrix.asset_path }}
          archive: false
