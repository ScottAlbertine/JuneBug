name: Build MCP Server Binaries

on:
  push:
    tags:
      - "v*" # Triggers automatically when you push a version tag like v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.builder }}

    strategy:
      matrix:
        include:
          - os: windows
            builder: windows-latest
            target_name: JuneBug-windows
            asset_name: JuneBug-windows.exe
          - os: macos
            builder: macos-latest
            target_name: JuneBug-macos
            # eventually, asset_name will be JuneBug-macos.app once I get system tray support
            asset_name: JuneBug-macos
          - os: linux
            builder: ubuntu-latest
            target_name: JuneBug-linux
            asset_name: JuneBug-linux

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name ${{ matrix.target_name }} main.py

      - name: Upload Release Asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target_name }}
          path: ${{ matrix.asset_name }}