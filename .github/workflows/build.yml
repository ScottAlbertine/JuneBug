name: Build MCP Server Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.builder }}

    strategy:
      matrix:
        include:
          - os: Windows
            builder: windows-latest
            target_name: JuneBug-windows
            asset_path: dist/JuneBug-windows
          - os: MacOS
            builder: macos-latest
            target_name: JuneBug-macos
            asset_path: dist/JuneBug-macos.app
          - os: Linux
            builder: ubuntu-latest
            target_name: JuneBug-linux
            asset_path: dist/JuneBug-linux

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # This is only needed for ubuntu, since pystray tries to connect to an X display on import
      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build with PyInstaller
        run: pyinstaller --windowed --name ${{ matrix.target_name }} --icon icon.png --add-data icon.png:. main.py

      - name: Upload Release Asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target_name }}
          path: ${{ matrix.asset_path }}
