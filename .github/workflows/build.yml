name: Build MCP Server Binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: Windows
            builder: windows-latest
            spec_path: specs/JuneBug-windows.spec
            artifact_name: someWindowsThing
            artifact_path: dist/JuneBug-windows.exe
            archive: false

          - os: MacOS
            builder: macos-latest
            spec_path: specs/JuneBug-macos.spec
            artifact_name: SomeMacThihng
            artifact_path: dist/*.app
            archive: true

          - os: Linux
            builder: ubuntu-latest
            spec_path: specs/JuneBug-linux.spec
            artifact_name: someLinuxthing
            artifact_path: dist/JuneBug-linux
            archive: false

    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.builder }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # This is only needed for ubuntu, since pystray tries to connect to an X display on import
      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build with PyInstaller
        run: pyinstaller ${{ matrix.spec_path }}

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          archive: ${{ matrix.archive }}
